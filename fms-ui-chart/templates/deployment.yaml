apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fms-ui.fullname" . }}
  labels:
    app: {{ include "fms-ui.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fms-ui.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "fms-ui.name" . }}
    spec:
      containers:
        - name: fms-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
