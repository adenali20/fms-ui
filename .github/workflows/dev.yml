name: CI - Dev

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout application code
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 20.16.0

      # 3️⃣ Install dependencies & build
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 4️⃣ Login to DockerHub
      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 5️⃣ Build & push image
      - name: Build & push Docker image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG=dev-$SHA
          docker build -t adenli/fms-ui:$IMAGE_TAG .
          docker push adenli/fms-ui:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6️⃣ Setup kubectl
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.DO_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # 7️⃣ Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v4

      # 8️⃣ Deploy to Kubernetes using Helm
      - name: Helm upgrade fms-ui (dev)
        run: |
          helm upgrade --install fms-ui ./helm \
            --namespace dev \
            --create-namespace \
            --set image.repository=adenli/fms-ui \
            --set image.tag=${IMAGE_TAG}
